# Publica docs/ como sitio con GitLab Pages (git-pages.ucr.ac.cr).
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public && cp -r docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "revamp-2026-11"
